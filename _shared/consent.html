<!-- ===== ELFSIGHT (Google-Bewertungen) =====
     data-cookieyes sorgt dafür, dass CookieYes dieses Skript erst
     ausführt, wenn jemand der Kategorie "advertisement" zustimmt.

     WICHTIG: Hier steht bewusst KEIN type="text/plain". Manche
     Consent-Tools erwarten das, CookieYes nicht - es hält ein ganz
     normales <script> selbst an. Mit text/plain würde das Widget
     nie geladen. Bitte so lassen.

     Das automatische Blockieren von CookieYes erfasst elfsightcdn.com
     vermutlich ohnehin. Die ausdrückliche Auszeichnung ist die sichere
     Variante und greift auch dann, wenn der Scan sie übersieht. -->
<script data-cookieyes="cookieyes-advertisement"
        src="https://elfsightcdn.com/platform.js" async></script>
